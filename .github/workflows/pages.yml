# GitHub Pages 배포 — main에 푸시하면 design/ 목업을 그대로 올린다.
# Pages는 저장소 Settings → Pages → Source: GitHub Actions 로 한 번 켜 두어야 한다(워크플로 토큰으로는 켤 수 없음).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r design _site/design
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
