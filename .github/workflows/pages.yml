# GitHub Pages 배포 — main에 푸시하면 design/ 목업을 그대로 올린다.
# 첫 실행에서 Pages 사이트를 자동으로 켠다(configure-pages enablement).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r design _site/design
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
