<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>크몽 서비스 B안 브랜드 색</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* B안(어두운 바탕 + 밝은 강조 판 + 극굵은 문구 + 관리자 화면) 구조는 그대로, 색만 브랜드 토큰(docs/13)으로 바꾼 4안.
   N1 네이비-950 + 본 판 · N2 로고 네이비 + 본 판 · N3 따뜻한 검정 + 본 판 · N4 네이비-950 + 시그널 판.
   각 안은 섹션의 CSS 변수만 다르다(--bk 바탕, --card, --ln 선, --ac 강조 판, --aci 판 위 글자, --em 문구 강조, --mut, --txt) */
*{box-sizing:border-box}
body{margin:0;background:#888;font-family:"Pretendard",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;padding:20px}
section{position:relative;overflow:hidden;margin:0 0 40px;background:var(--bk);color:#FAF9F6}
.N1{--bk:#151A33;--card:#1F2447;--ln:#2B3160;--ac:#F3F1EC;--aci:#1C1B18;--em:#DCEBFB;--mut:#AEB7D6;--txt:#CCD3E8}
.N2{--bk:#2B3160;--card:#3B4478;--ln:#4E5A94;--ac:#FAF9F6;--aci:#2B3160;--em:#DCEBFB;--mut:#CCD3E8;--txt:#E4E8F4}
.N3{--bk:#1C1B18;--card:#2E2C28;--ln:#4A4741;--ac:#FAF9F6;--aci:#1C1B18;--em:#8A96C2;--mut:#B3AEA3;--txt:#E8E5DE}
.N5{--bk:#1F2447;--card:#2B3160;--ln:#3B4478;--ac:#FAF9F6;--aci:#2B3160;--em:#DCEBFB;--mut:#AEB7D6;--txt:#CCD3E8}  /* N1과 N2 사이: navy-900 */
.N4{--bk:#151A33;--card:#1F2447;--ln:#2B3160;--ac:#3B6FE0;--aci:#FFFFFF;--em:#DCEBFB;--mut:#AEB7D6;--txt:#CCD3E8}
.em{color:var(--em)}
/* 강조 낱말: 강조 판 색을 글자 뒤에 칠한다(형광펜처럼) */
.hl{background:var(--ac);color:var(--aci);padding:0 .14em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tag{display:inline-block;font-weight:700;color:var(--aci);background:var(--ac);border-radius:4px}

/* 가상 관리자 화면 — 사이드바도 브랜드 네이비 */
.dash{width:640px;height:400px;background:#fff;border-radius:8px;display:grid;grid-template-columns:120px 1fr;overflow:hidden;font-size:11px;color:#1C1B18;text-align:left}
.dash .sb{background:#151A33;color:#CCD3E8;padding:14px 10px}
.dash .sb b{display:flex;align-items:center;gap:6px;color:#fff;font-size:12px;margin-bottom:16px}
.dash .sb b i{width:16px;height:16px;border-radius:4px;background:#3B6FE0}
.dash .sb div{padding:6px 8px;border-radius:5px;margin-bottom:2px}
.dash .sb div.on{background:#2B3160;color:#fff}
.dash .mn{padding:14px 16px;background:#FAF9F6}
.dash .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dash .hd h6{margin:0;font-size:14px}
.dash .hd span{font-size:10px;color:#8A857A;background:#fff;border:1px solid #E8E5DE;border-radius:5px;padding:3px 8px}
.dash .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.dash .kp div{background:#fff;border:1px solid #E8E5DE;border-radius:7px;padding:8px 10px}
.dash .kp em{display:block;font-style:normal;font-size:9.5px;color:#8A857A}
.dash .kp b{display:block;font-size:18px;margin-top:3px;color:#2B3160}
.dash .kp small{font-size:9px;color:#2E7D5B}
.dash .kp small.w{color:#C0392B}
.dash .tb{background:#fff;border:1px solid #E8E5DE;border-radius:7px;overflow:hidden}
.dash table{width:100%;border-collapse:collapse}
.dash th{font-size:9.5px;font-weight:600;color:#8A857A;text-align:left;padding:7px 10px;background:#F3F1EC}
.dash td{padding:7px 10px;border-top:1px solid #F3F1EC;white-space:nowrap}
.st{font-size:9px;font-weight:700;padding:2px 7px;border-radius:9px}
.st.a{background:#E2EFE8;color:#2E7D5B}.st.b{background:#F5EBDB;color:#8A5A12}.st.c{background:#E4E8F4;color:#2B3160}.st.d{background:#F6E0DD;color:#C0392B}

/* 메인 */
.main{width:652px;height:488px;padding:50px}
.main .tag{font-size:12px;padding:4px 8px}
.main h1{font-size:50px;line-height:1.1;font-weight:900;letter-spacing:-.045em;margin:16px 0 0}
.main .panel{position:absolute;left:50px;right:50px;bottom:50px;height:150px;background:var(--ac);border-radius:14px;padding:18px 20px;color:var(--aci)}
.main .panel b{display:block;font-size:15px;font-weight:800;line-height:1.5}
.main .panel span{display:block;font-size:12px;font-weight:600;margin-top:6px;opacity:.75}
.main .scrn{position:absolute;right:68px;bottom:68px;transform:scale(.5);transform-origin:100% 100%;box-shadow:0 18px 40px rgba(0,0,0,.3);border-radius:8px}

/* 상세 첫 장 */
.dt{width:1200px;padding:96px 90px}
.dt .tag{font-size:18px;padding:6px 12px}
.dt h2{font-size:56px;line-height:1.2;font-weight:900;letter-spacing:-.04em;margin:18px 0 0}
.dt p.s{font-size:23px;line-height:1.6;color:var(--mut);margin:22px 0 0}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:52px}
.cards3 > div{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:30px 28px}
.cards3 i{font-style:normal;font-size:15px;font-weight:800;letter-spacing:.06em;color:var(--em)}
.cards3 b{display:block;font-size:24px;line-height:1.35;margin:14px 0 10px}
.cards3 span{font-size:18px;line-height:1.6;color:var(--mut)}
.acp{margin-top:64px;background:var(--ac);border-radius:24px;padding:44px 40px 0;color:var(--aci);overflow:hidden}
.acp > b{font-size:34px;letter-spacing:-.03em}
.acp .chk{display:flex;gap:28px;margin:14px 0 30px;font-size:19px;font-weight:700}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
  <section class="main {K}" id="{K}-main">
    <span class="tag">사내 업무 시스템 개발</span>
    <h1>엑셀로 하던 일<br><span class="hl">웹 시스템</span>으로</h1>
    <div class="panel"><b>업무 정리<br>→ 화면 설계<br>→ 개발</b><span>PC · 모바일</span></div>
    <div class="scrn" data-dash></div>
  </section>
  <section class="dt {K}" id="{K}-detail">
    <span class="tag">이런 업무라면</span>
    <h2>같은 내용을 파일 세 개에<br><span class="hl">옮겨 적고</span> 계신가요?</h2>
    <p class="s">엑셀과 종이로 하던 일을 사내 웹 시스템으로 만들면, 한 번 입력한 내용을 모두가 같은 화면에서 봅니다.</p>
    <div class="cards3">
      <div><i>01</i><b>어느 파일이 최신인지 매번 확인합니다</b><span>요청과 재고를 엑셀 여러 개에 나눠 적습니다.</span></div>
      <div><i>02</i><b>처리 상황을 사람에게 물어야 압니다</b><span>누가 언제 처리했는지 기록이 없습니다.</span></div>
      <div><i>03</i><b>담당자가 바뀌면 처음부터 배웁니다</b><span>일하는 방법이 한 사람의 파일에만 있습니다.</span></div>
    </div>
    <div class="acp">
      <b>웹 시스템으로 바꾸면</b>
      <div class="chk"><span>✓ 모두 같은 화면에서 봅니다</span><span>✓ 처리 기록이 남습니다</span><span>✓ 역할마다 할 일이 나뉩니다</span></div>
      <div style="display:flex;justify-content:center"><div style="border-radius:10px 10px 0 0;height:560px;overflow:hidden;box-shadow:0 -6px 30px rgba(0,0,0,.15)"><div data-dash data-scale="1.5"></div></div></div>
    </div>
  </section>
</template>
<script>
const tpl = document.getElementById('tpl').innerHTML;
document.getElementById('root').innerHTML = ['N1', 'N2', 'N3', 'N4', 'N5'].map((k) => tpl.replaceAll('{K}', k)).join('');
const DASH = `<div class="dash">
  <div class="sb"><b><i></i>업무 포털</b><div class="on">대시보드</div><div>업무 요청</div><div>재고 관리</div><div>근무표</div><div>설정</div></div>
  <div class="mn"><div class="hd"><h6>대시보드</h6><span>이번 주</span></div>
    <div class="kp"><div><em>새 요청</em><b>12</b><small>오늘 3건</small></div><div><em>처리 중</em><b>5</b><small>담당 3명</small></div><div><em>이번 주 완료</em><b>18</b><small>지난주보다 4건 ↑</small></div><div><em>기한 임박</em><b>2</b><small class="w">내일까지</small></div></div>
    <div class="tb"><table><tr><th>요청</th><th>요청한 사람</th><th>담당</th><th>상태</th><th>기한</th></tr>
      <tr><td>거래처 단가표에 시작일 열 추가</td><td>김서연</td><td>박도현</td><td><span class="st b">처리 중</span></td><td>9/19</td></tr>
      <tr><td>비품 신청 화면 필수값 추가</td><td>이지우</td><td>박도현</td><td><span class="st c">검토</span></td><td>9/22</td></tr>
      <tr><td>출고 화면 날짜 검색</td><td>최민준</td><td>정하늘</td><td><span class="st d">기한 임박</span></td><td>9/17</td></tr>
      <tr><td>월말 보고서 양식</td><td>한유진</td><td>정하늘</td><td><span class="st a">완료</span></td><td>9/15</td></tr>
      <tr><td>검사 결과 엑셀 내려받기</td><td>오세훈</td><td>박도현</td><td><span class="st a">완료</span></td><td>9/14</td></tr>
    </table></div></div></div>`;
document.querySelectorAll('[data-dash]').forEach((el) => {
  el.insertAdjacentHTML('beforeend', DASH);
  const s = el.dataset.scale;
  if (s) { const d = el.lastElementChild; d.style.transform = `scale(${s})`; d.style.transformOrigin = '0 0'; el.style.width = 640 * s + 'px'; el.style.height = 400 * s + 'px'; }
});
</script>
</body>
</html>
