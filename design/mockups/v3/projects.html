<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — Prologue&</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="v3.css?v=202609181718">
</head>
<body>

<header class="hdr">
  <a class="brand" href="index.html" aria-label="Prologue&">Prologue<span class="bamp">&amp;</span></a>
  <nav>
    <a href="projects.html" style="color:var(--navy-800)">Projects</a>
    <button type="button" data-open-drawer>문의</button>
  </nav>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <h1 class="h1">Projects</h1>
      <p class="lead">지금까지 한 일. 이름 뒤의 빈칸을 채워 온 것들입니다.</p>
      <p class="cap cnt"><span id="cnt"></span> · 2026-09-16 기준</p>
    </div>
    <div id="list"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="logo-bottom"><span class="rule r" style="left:0;right:0;width:auto;background:var(--bone-900)"></span></div>
    <p class="foot-cap">Prologue<span class="amp">&amp;</span> — and, 그리고 end. 처음과 끝을 함께합니다.</p>
    <div class="foot-row">
      <nav><a href="projects.html">Projects</a><a href="mailto:hello@prologue.and">hello@prologue.and</a><a href="#" data-open-drawer>문의</a></nav>
      <span>© 2026 Prologue&amp;</span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
<script src="v3.js?v=202609181718"></script>
<script>
  const EMBED = location.search.includes('embed=1') ? '&embed=1' : '';
  function render() {
    const items = V3.projects.slice().sort((a, b) => a.order - b.order);
    document.getElementById('cnt').textContent = `${items.length}건`;
    document.getElementById('list').innerHTML = items.length ? items.map((p, i) => `
      <a class="prow" href="case.html?p=${p.slug}&v=202609181607${EMBED}">
        <span class="num">${String(p.order).padStart(2, '0')}</span>
        <div>
          <div class="h2">${p.title}</div>
          <div class="meta">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}<span>${p.year}</span><span>${V3.problem(p.problem).name}</span>${p.featured ? '<span style="color:var(--navy-800)">대표</span>' : ''}</div>
          <p class="res">${p.tagline}</p>
        </div>
      </a>`).join('')
      : `<div class="empty"><p>아직 이 유형의 작업이 없습니다.<br>비슷한 고민이 있으면 편하게 물어보세요.</p><a class="btn" href="#" data-open-drawer>프로젝트 문의 <i class="tri"></i></a></div>`;
  }
  render();
  // 전환 A: 클릭한 행의 제목만 공유 요소로(이름은 문서에 하나만). 돌아올 때를 위해 slug 기억
  document.getElementById('list').addEventListener('click', e => { const a = e.target.closest('.prow'); if (!a) return; document.querySelectorAll('.prow.vt').forEach(r => r.classList.remove('vt')); a.classList.add('vt'); try { sessionStorage.setItem('vt-slug', new URL(a.href, location.href).searchParams.get('p')); } catch (err) {} });
  // 상세에서 돌아올 때: 같은 행에 이름을 붙여 제목이 제자리로 내려오게
  addEventListener('pagereveal', e => { let slug = null; try { slug = sessionStorage.getItem('vt-slug'); } catch (err) {} if (!slug) return; const row = [...document.querySelectorAll('.prow')].find(r => r.getAttribute('href').includes('p=' + slug)); if (row) { row.classList.add('vt'); if (e.viewTransition) e.viewTransition.finished.finally(() => row.classList.remove('vt')); else row.classList.remove('vt'); } });
  V3.initLenis();
  V3.drawer.init();
</script>
</body>
</html>
