<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prologue& D2 — 디자인 방향 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--ink:#111318;--navy:#2B3160;--steel:#7A8AA6;--rule:#E1E3EA;--bg:#F4F5F8}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.6}
  .top{display:flex;align-items:center;gap:1rem;padding:.8rem 1.2rem;background:#fff;border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:2;flex-wrap:wrap}
  .top h1{font-size:15px;margin:0 1rem 0 0;font-weight:700}
  .grp{display:flex;align-items:center;gap:.3rem}
  .grp small{color:var(--steel);margin-right:.3rem}
  .grp button{border:1px solid var(--rule);background:#fff;padding:.45rem .8rem;border-radius:4px;cursor:pointer;font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:.45rem}
  .grp button i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.08)}
  #pals button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  #vers button.on,#modes button.on{border-color:var(--ink)}
  .top .open{margin-left:auto;font-size:13px;color:var(--navy)}
  .stage{display:grid;grid-template-columns:1fr 440px;gap:1.2rem;padding:1.2rem;align-items:start}
  .stage.single{grid-template-columns:1fr}
  .stage.single .mobile{display:none}
  .device{background:#fff;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
  .device .cap{padding:.5rem .8rem;border-bottom:1px solid var(--rule);color:var(--steel);font-size:12px;display:flex;justify-content:space-between}
  .desktop .vp{width:100%;overflow:hidden;position:relative}
  .desktop iframe{width:1440px;height:900px;border:0;transform-origin:0 0;display:block}
  .mobile .vp{display:flex;justify-content:center;background:#EEF0F4;padding:1rem 0}
  .mobile iframe{width:400px;height:860px;border:0;display:block}
  .all{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;padding:1.2rem}
  .all .cell{background:#fff;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
  .all .cell .cap{padding:.4rem .7rem;border-bottom:1px solid var(--rule);font-size:12px;color:var(--steel);display:flex;justify-content:space-between}
  .all .cell .vp{overflow:hidden;position:relative}
  .all .cell iframe{width:1440px;height:900px;border:0;transform-origin:0 0;display:block;pointer-events:none}
  .desc{margin:0 1.2rem 1.2rem;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:1rem 1.2rem}
  .desc table{border-collapse:collapse;width:100%;font-size:13px}
  .desc th,.desc td{border-top:1px solid var(--rule);padding:.5rem .5rem;text-align:left;vertical-align:top}
  .desc th{color:var(--steel);font-weight:500}
  .sw{display:inline-flex;gap:3px;vertical-align:middle}
  .sw i{width:16px;height:16px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
  .note{margin:0 1.2rem 1.2rem;font-size:12px;color:var(--steel)}
</style>
</head>
<body>
  <div class="top">
    <h1>Prologue& D2 — 디자인 방향</h1>
    <div class="grp" id="pals"><small>방향</small></div>
    <div class="grp" id="vers"><small>구조</small><button data-v="2" class="on">D2 합본</button><button data-v="1">D1 분리</button><button data-v="3">D3 풀블리드</button></div>
    <div class="grp" id="modes"><small>보기</small><button data-mode="both" class="on">데스크톱 + 모바일</button><button data-mode="single">데스크톱만</button><button data-mode="all">4개 한눈에</button></div>
    <a class="open" id="open" href="d-poster.html?v=2&s=1" target="_blank">새 탭에서 열기 ↗</a>
  </div>

  <div class="stage" id="stage">
    <div class="device desktop"><div class="cap"><span>데스크톱 1440×900</span><span id="scaleLabel"></span></div><div class="vp" id="dvp"><iframe id="dframe" src="d-poster.html?v=2&s=1" title="데스크톱"></iframe></div></div>
    <div class="device mobile"><div class="cap"><span>모바일 400×860</span><span>실제 크기</span></div><div class="vp"><iframe id="mframe" src="d-poster.html?v=2&s=1" title="모바일"></iframe></div></div>
  </div>
  <div class="all" id="all" hidden></div>

  <div class="desc">
    <table>
      <tr><th>#</th><th>이름</th><th>색</th><th>서체</th><th>정렬·크기</th><th>이미지 처리</th></tr>
      <tr id="row1"></tr><tr id="row2"></tr><tr id="row3"></tr><tr id="row4"></tr>
    </table>
  </div>
  <p class="note">D2 구조는 고정. 각 방향은 `d-poster.html?s=1..4`로 색·서체·정렬·크기·이미지 처리가 한 세트로 바뀝니다. 이미지는 임시(제품 화면 HTML을 캡처한 img/*.png). 근거는 docs/12 §6·§8.</p>

<script>
  const STY = [
    { n: 1, name: 'Rauno Gray', sw: ['#ECEDF0', '#7DB6F2', '#2B3160'], color: '회색 + 하늘 + 네이비', font: 'Pretendard 500, 자간 -3.5%', layout: '좌측 계단식, 초대형', img: '기울인 스크린샷 카드가 헤드라인을 덮음' },
    { n: 2, name: 'Editorial Warm', sw: ['#EDE9E2', '#D4C9B0', '#9E7B56'], color: 'Cloud Dancer 웜톤', font: '헤드라인 Noto Serif KR 500 + 본문 Pretendard', layout: '중앙 정렬, 한 단계 작게, 여백 넓게', img: '얇은 검정 액자 + 캡션' },
    { n: 3, name: 'Swiss Bold', sw: ['#ECECEC', '#FFE14D', '#000000'], color: '회색 + 노랑 + 검정', font: 'Pretendard 800, 자간 -5%, 행간 0.95', layout: '좌측 꽉 채움, 최대 크기', img: '오른쪽 절반 풀블리드, 글자가 이미지 위로' },
    { n: 4, name: 'Product Teal', sw: ['#EAEFEE', '#9FD3C7', '#0F4C5C'], color: '틸 계열', font: 'Pretendard 600', layout: '작고 정돈된 위계, 정보 많음', img: '브라우저 프레임 안에 크게' }
  ];
  let sN = 1, v = 2;
  const url = () => `d-poster.html?v=${v}&s=${sN}`;
  const dframe = document.getElementById('dframe'), mframe = document.getElementById('mframe'), open = document.getElementById('open'), stage = document.getElementById('stage'), all = document.getElementById('all');
  document.getElementById('pals').innerHTML += STY.map(p => `<button data-s="${p.n}" class="${p.n === 1 ? 'on' : ''}"><i style="background:${p.sw[1]}"></i>S${p.n} ${p.name}</button>`).join('');
  STY.forEach(p => { document.getElementById('row' + p.n).innerHTML = `<td>S${p.n}</td><td><b>${p.name}</b></td><td><span class="sw">${p.sw.map(x => `<i style="background:${x}" title="${x}"></i>`).join('')}</span> ${p.color}</td><td>${p.font}</td><td>${p.layout}</td><td>${p.img}</td>`; });
  function apply() { dframe.src = url(); mframe.src = url(); open.href = url(); document.querySelectorAll('#pals button').forEach(b => b.classList.toggle('on', +b.dataset.s === sN)); document.querySelectorAll('#vers button').forEach(b => b.classList.toggle('on', +b.dataset.v === v)); }
  function fit() { const vp = document.getElementById('dvp'); const k = Math.min(1, vp.clientWidth / 1440); dframe.style.transform = `scale(${k})`; vp.style.height = (900 * k) + 'px'; document.getElementById('scaleLabel').textContent = Math.round(k * 100) + '%'; }
  function fitAll() { all.querySelectorAll('.vp').forEach(vp => { const f = vp.querySelector('iframe'); const k = vp.clientWidth / 1440; f.style.transform = `scale(${k})`; vp.style.height = (900 * k) + 'px'; }); }
  document.getElementById('pals').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b) { sN = +b.dataset.s; apply(); } });
  document.getElementById('vers').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { v = +b.dataset.v; apply(); } });
  document.getElementById('modes').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (!b) return; document.querySelectorAll('#modes button').forEach(x => x.classList.toggle('on', x === b)); const m = b.dataset.mode;
    stage.hidden = m === 'all'; all.hidden = m !== 'all'; stage.className = 'stage' + (m === 'single' ? ' single' : '');
    if (m === 'all') { all.style.gridTemplateColumns = 'repeat(2,1fr)'; all.innerHTML = STY.map(p => `<div class="cell"><div class="cap"><span>S${p.n} ${p.name}</span><a href="d-poster.html?v=${v}&s=${p.n}" target="_blank">열기 ↗</a></div><div class="vp"><iframe src="d-poster.html?v=${v}&s=${p.n}" title="S${p.n}"></iframe></div></div>`).join(''); fitAll(); }
    if (m !== 'all') fit(); });
  window.addEventListener('resize', () => { fit(); if (!all.hidden) fitAll(); });
  apply(); fit();
</script>
</body>
</html>
