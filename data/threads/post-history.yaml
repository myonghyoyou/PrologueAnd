    date: null                # 대화 기록상 밤 9시 예약 게시. 날짜는 기록 없음
    series: 업무 개선기         # 게시 당시 첫 줄 표기는 「업무개선기-1」
    project: 교대 근무표 (shift-board)
    status: published         # 사용자 확인: 계정에 올라가 있는 글
    planned_at: null
    published_at: null        # "9시로 예약" — 날짜 미확인
    url: null
    first_sentence: 퇴사한 사람이 근무표에 들어가도 아무도 몰랐다.
    ending_pattern: 화면 안내("어떻게 바꿨는지는 화면 붙여둠!") + 질문("혹시 아직도 근무표 엑셀로 짜는 스친들 많음?")
    attachments: null         # 실제 첨부한 그림 기록 없음
    tag: null
    views: null
    likes: null
    replies: null             # 답글이 달린 적 있음(사용자 전달), 수는 기록 없음
    reposts: null
    inquiries: null
    notes: 반응 인용 "이게 이렇게 되는 거였어요?!"는 사용자가 전한 실제 말과 다름. 사용자 판단으로 삭제·재작성하지 않고 유지.

