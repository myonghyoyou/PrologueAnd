# Threads 게시 이력 — threads-post 스킬이 읽고 갱신한다.
# 필드 설명: .claude/skills/threads-post/templates/content-history.md
# 규칙
#  - status: draft(초안) / approved(사용자 승인, 아직 안 올림) / published(사용자가 실제 게시를 확인) / deleted(게시 후 삭제) / cancelled
#  - 사용자 확인 없이 published 로 바꾸지 않는다. 모르는 값은 null.
#  - id 는 내부 관리용. 게시물에 노출하지 않는다.
#  - published_at 은 실제로 올린 시각(KST, ISO 8601). planned_at 은 계획 시각.
#  - first_sentence / ending_pattern 은 「문장 패턴 중복 검사」에 쓴다.

posts:
